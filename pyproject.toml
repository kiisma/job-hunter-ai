[project]
name = "job-hunter-ai"
version = "0.1.0"
description = "CLI assistant to search vacancies, tailor resumes, and prepare applications quickly"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
job-hunter = "job_hunter_ai.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
