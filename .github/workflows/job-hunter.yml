name: Job Hunter (scheduled)

on:
  workflow_dispatch:
    inputs:
      keywords:
        description: 'Comma-separated keywords (e.g. "python, ai, backend")'
        required: false
        default: "python, ai, backend"
      limit:
        description: "Maximum jobs to process"
        required: false
        default: "10"
  schedule:
    - cron: "0 */6 * * *"

jobs:
  run-job-hunter:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements ]; then
            pip install -r requirements
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install -e .
          fi

      - name: Run tests
        run: pytest

      - name: Prepare sample resume
        run: |
          cat > resume.md <<'RESUME'
          # Resume
          Python backend developer.
          FastAPI, Docker, PostgreSQL, REST API integration.
          RESUME

      - name: Run pipeline
        env:
          KEYWORDS: ${{ github.event.inputs.keywords || 'python, ai, backend' }}
          LIMIT: ${{ github.event.inputs.limit || '10' }}
        run: |
          python -m job_hunter_ai.cli pipeline \
            --resume-file ./resume.md \
            --keywords "$KEYWORDS" \
            --limit "$LIMIT" \
            --sources "remoteok,remotive" \
            --output-dir ./applications \
            --store-path ./.job_hunter/store.json

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: job-hunter-applications
          path: |
            applications/*.json
            .job_hunter/store.json
          if-no-files-found: warn
