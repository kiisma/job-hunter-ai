name: Job Hunter (scheduled)

on:
  workflow_dispatch:
    inputs:
      query:
        description: "Search query"
        required: false
        default: "product manager remote"
  schedule:
    - cron: "0 7 * * *"  # каждый день 07:00 UTC

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements

      - name: Run agent
        env:
          PYTHONPATH: src
        run: |
          QUERY="${{ github.event.inputs.query }}"
          if [ -z "$QUERY" ]; then QUERY="product manager remote"; fi
          python -m job_hunter_ai.main --query "$QUERY"

      - name: Commit results back to repo
        run: |
          git config user.name "job-hunter-bot"
          git config user.email "job-hunter-bot@users.noreply.github.com"
          git add -A
          git commit -m "Update output ($(date -u +'%Y-%m-%d %H:%M UTC'))" || echo "No changes"
          git push
